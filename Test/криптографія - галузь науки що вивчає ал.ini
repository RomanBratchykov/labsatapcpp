криптографія - галузь науки що вивчає алгоритми перетворення повідомлень у незрозумілу для сторонніх осіб форму 
При використанні крипотграфії утворюється шифр - зашифроване повідомлення, яке в залежності від складності алгоритму має різний ступіть захисту
Процес шифрування поєднується з дешифруванням - перетворенням зашифрованого повідомлення у зрозумілу форму
всі криптографічні алгоритми поділяються на симетричні та асиметричні
симетричні алгоритми - алгоритми, які використовують один і той же ключ для шифрування та дешифрування
асиметричні алгоритми - алгоритми, які використовують різні ключі для шифрування та дешифрування